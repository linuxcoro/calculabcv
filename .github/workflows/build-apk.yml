name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Plataformas: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "Build tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      - name: Pruebas del núcleo
        run: node --test tests/calculadora.test.mjs

      - name: Install Capacitor 8
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Preparar assets web
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          test -s www/index.html
          grep -q 'Calculadora de Pago Móvil' www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Configurar versión
        run: |
          set -euo pipefail
          APP_VERSION_CODE=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          APP_VERSION_NAME="1.0.${APP_VERSION_CODE}"
          echo "APP_VERSION_NAME=${APP_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Versión: ${APP_VERSION_NAME} (versionCode ${APP_VERSION_CODE})"
          sed -i -E "s/versionCode [0-9]+/versionCode ${APP_VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${APP_VERSION_NAME}\"/" android/app/build.gradle
          grep -q "versionCode ${APP_VERSION_CODE}" android/app/build.gradle
          grep -q "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          set -uo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          estado=${PIPESTATUS[0]}
          if [ "$estado" -ne 0 ]; then
            echo "::error::Gradle falló con código ${estado}"
            grep -E "FAILURE:|What went wrong|Caused by:|error:|Could not|Execution failed|No such file|Permission denied" /tmp/gradle.log \
              | tail -n 8 \
              | while IFS= read -r linea; do
                  echo "::error::${linea}"
                done
            exit "$estado"
          fi

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK: $(stat -c%s "$APK") bytes"

          unzip -p "$APK" assets/public/index.html | grep -q 'Calculadora de Pago Móvil'

          MANIFEST_TXT="$(mktemp)"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          if ! "$AAPT2" dump badging "$APK" > "$MANIFEST_TXT" 2>/dev/null; then
            unzip -p "$APK" AndroidManifest.xml | strings > "$MANIFEST_TXT"
          fi
          grep -q "com.linuxcoro.calculabcv" "$MANIFEST_TXT"
          grep -q "android.permission.INTERNET" "$MANIFEST_TXT"
          echo "APK verificado: paquete, INTERNET y assets de la app."

          cp "$APK" "calculabcv-${APP_VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculabcv-apk
          path: calculabcv-*.apk
          if-no-files-found: error
          retention-days: 30
